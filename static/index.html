<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Lock In</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0a0a14;--card:rgba(255,255,255,.045);--card2:rgba(255,255,255,.075);--line:rgba(255,255,255,.09);--txt:#ecebf5;--mut:#8f8da8;--acc:#8b7cf6;--acc2:#5b8cff;--content:#c084fc;--jobs:#38bdf8;--life:#4ade80;--warn:#fbbf24;--bad:#f87171;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{overflow:hidden;color:var(--txt);font:14px/1.45 "Segoe UI Variable","Segoe UI",system-ui,-apple-system,sans-serif;
background:radial-gradient(1100px 700px at 85% -10%,#2a1d62 0,transparent 60%),radial-gradient(900px 600px at -10% 110%,#102a58 0,transparent 55%),var(--bg);
display:grid;grid-template-columns:208px 1fr;grid-template-rows:auto 1fr auto}
body.zen{grid-template-columns:0 1fr}body.zen #side,body.zen #top,body.zen #arena{display:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.mut{color:var(--mut)}
/* sidebar */
#side{grid-row:1/4;padding:18px 12px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line);background:rgba(8,8,18,.55);backdrop-filter:blur(14px)}
.logo{display:flex;align-items:center;gap:10px;padding:2px 10px 16px;font-weight:700;font-size:17px;letter-spacing:.2px}
.logo i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-style:normal;font-size:14px;box-shadow:0 4px 18px rgba(139,124,246,.5)}
.nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--mut);text-align:left;width:100%;transition:.15s}
.nav:hover{background:var(--card);color:var(--txt)}
.nav.on{background:linear-gradient(90deg,rgba(139,124,246,.22),rgba(91,140,255,.08));color:#fff;box-shadow:inset 2px 0 0 var(--acc)}
.nav b{margin-left:auto;font-size:11px;background:var(--acc);color:#fff;border-radius:99px;padding:1px 7px;font-weight:600}
.nav b:empty{display:none}
.sp{flex:1}
#mini{margin:6px 4px;padding:10px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:none;text-align:center}
#mini.on{display:block}#mini .t{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
#clock{padding:6px 12px;font-size:12px;color:var(--mut)}
/* top bar */
#top{padding:16px 26px 6px;display:flex;gap:12px;align-items:center}
#cap{flex:1;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 6px 4px 16px;transition:.15s}
#cap:focus-within{border-color:var(--acc);box-shadow:0 0 0 4px rgba(139,124,246,.16)}
#cap input{flex:1;background:none;border:0;outline:0;padding:10px 0;font-size:15px}
#cap input::placeholder{color:#6f6d88}
kbd{font:11px ui-monospace,Consolas,monospace;border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--mut)}
#saved{font-size:12px;color:var(--mut);min-width:64px;text-align:right}
#main{padding:14px 26px 26px;overflow:auto;min-height:0}
#main::-webkit-scrollbar{width:10px}#main::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:9px}
h1{font-size:30px;font-weight:700;letter-spacing:-.3px}h2{font-size:22px;font-weight:700}h4{font-size:12px;text-transform:uppercase;letter-spacing:1.1px;color:var(--mut);font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
h4 span{background:var(--card2);padding:0 7px;border-radius:99px;letter-spacing:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;backdrop-filter:blur(10px)}
.btn{padding:7px 13px;border-radius:10px;background:var(--card2);border:1px solid var(--line);transition:.15s;font-size:13px;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.12)}
a.btn{color:inherit;text-decoration:none;display:inline-block}
.btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:#fff;font-weight:600}
.btn.pri:hover{filter:brightness(1.1)}
.btn.sm{padding:3px 9px;font-size:12px;border-radius:8px}
.btn.ok{background:rgba(74,222,128,.16);border-color:rgba(74,222,128,.35);color:#86efac}
.btn.bad{color:var(--bad)}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:9px;padding:8px 10px;outline:0;width:100%;color-scheme:dark}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
select option{background:#15142a}
/* today */
.tgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:18px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;padding:4px 2px 2px}
.hero .big{font-size:44px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 10px;border-radius:10px;transition:.12s}
.row:hover{background:var(--card2)}
.row .ttl{flex:1 1 110px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.row.done .ttl{text-decoration:line-through;color:var(--mut)}
.row .tm{min-width:62px;color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 10px var(--c)}
.cb{width:20px;height:20px;border-radius:7px;border:2px solid rgba(255,255,255,.28);flex:none;display:grid;place-items:center;transition:.15s;font-size:12px;color:transparent}
.cb:hover{border-color:var(--acc)}
.done .cb,.cb.on{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:#fff}
.tag{font-size:11px;padding:1px 8px;border-radius:99px;background:rgba(251,191,36,.14);color:var(--warn);border:1px dashed rgba(251,191,36,.5)}
.slot{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:12px;background:var(--card2);border:1px solid var(--line);margin-bottom:8px;font-size:15px}
.slot.empty{border-style:dashed;color:var(--mut);cursor:pointer;background:transparent}
.slot.empty:hover{border-color:var(--acc);color:var(--txt)}
.slot .n{width:24px;height:24px;border-radius:8px;background:rgba(139,124,246,.2);color:#c4bcff;display:grid;place-items:center;font-weight:700;font-size:12px}
.slot.done .t{text-decoration:line-through;color:var(--mut)}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:9px;transition:width .4s}
.stat{display:flex;gap:14px}.stat div{flex:1;background:var(--card2);border-radius:12px;padding:10px 12px}.stat b{display:block;font-size:22px}
.links{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.links div{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mut)}.links span{flex:1}
.links a{color:#b7c3ff;text-decoration:none;background:rgba(91,140,255,.12);padding:2px 8px;border-radius:7px}.links a:hover{background:rgba(91,140,255,.25)}
.empty-note{color:var(--mut);padding:8px 4px;font-size:13px}
/* calendar */
.cal{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;height:100%}
.calmain{display:flex;flex-direction:column;min-height:0}
.calhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.calhead h2{flex:1}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:2px}.seg button{padding:5px 12px;border-radius:8px;color:var(--mut)}.seg .on{background:var(--card2);color:#fff}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow div{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);padding:0 8px 6px}
.grid{flex:1;grid-auto-rows:minmax(0,1fr);min-height:0}
.cell{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 7px 4px;overflow:hidden;cursor:pointer;transition:.12s;min-height:0}
.cell:hover{background:var(--card2)}.cell.other{opacity:.4}
.cell.sel{border-color:var(--acc);box-shadow:0 0 0 2px rgba(139,124,246,.3) inset}
.cell.drop{background:rgba(139,124,246,.22)}
.cell .d{font-size:13px;font-weight:600;margin-bottom:3px;display:flex;justify-content:space-between}
.cell.today .d span{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-radius:99px;padding:0 8px;box-shadow:0 0 14px rgba(139,124,246,.7)}
.chip{font-size:11.5px;padding:2px 7px;margin-bottom:3px;border-radius:7px;background:color-mix(in srgb,var(--c) 18%,transparent);border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab}
.chip b{font-weight:600;opacity:.85}
.chip.tent{border-left-style:dashed;background:transparent;border:1px dashed var(--c);opacity:.85}
.chip.done{text-decoration:line-through;opacity:.45}
.more{font-size:11px;color:var(--mut);padding-left:4px}
.side{display:flex;flex-direction:column;gap:14px;overflow:auto;min-height:0}
.week .cell .chip{white-space:normal}
/* boards */
.board{display:grid;gap:14px;align-items:start}
.colb{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:200px;transition:.12s}
.colb.drop{background:rgba(139,124,246,.16);border-color:var(--acc)}
.colb h4{margin-bottom:12px}
.bcard{background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:10px;padding:10px 11px;margin-bottom:8px;cursor:grab;transition:.12s}
.bcard:hover{transform:translateY(-1px);background:rgba(255,255,255,.11)}
.bcard .s{font-size:12px;color:var(--mut);margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bcard a{color:#b7c3ff;text-decoration:none}
.addrow{display:flex;gap:10px;margin:14px 0 18px}
/* focus */
.focus{display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:10px}
.ring{position:relative;width:300px;height:300px}.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .tt{font-size:64px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-2px}
.ctl{display:flex;gap:10px}
.park{width:420px;max-width:100%}
/* modal + toasts */
#modal{position:fixed;inset:0;background:rgba(4,4,12,.65);backdrop-filter:blur(6px);display:none;place-items:center;z-index:50}
#modal.on{display:grid}
.mcard{width:560px;max-width:94vw;max-height:92vh;overflow:auto;background:#14132a;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.mcard h3{margin-bottom:14px;font-size:18px}
.f{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}
.f.three{grid-template-columns:repeat(3,1fr)}.f.four{grid-template-columns:repeat(4,1fr)}.emorow{display:flex;flex-wrap:wrap;gap:4px;align-items:center}.em{padding:3px 7px;border-radius:8px;background:var(--card2);border:1px solid transparent;font-size:16px;line-height:1.3}.em:hover{background:rgba(255,255,255,.14)}.em.on{border-color:var(--acc);background:rgba(139,124,246,.28)}.em.sug{font-size:12px;border-color:var(--acc);color:#c4bcff}.emoin{width:84px!important;padding:4px 8px!important}.sw{width:22px;height:22px;border-radius:50%;border:2px solid transparent}.sw.on{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.2)}.sw.def{background:conic-gradient(#c084fc,#38bdf8,#4ade80,#c084fc)}
.tlhead{display:flex;align-items:center;gap:8px}.tlhead h4{flex:1;margin:0}
.any{margin:10px 0 4px;padding:6px 8px;border:1px dashed var(--line);border-radius:10px}
.tlscroll{height:560px;overflow:auto;border-radius:12px;background:rgba(255,255,255,.02);position:relative;margin-top:10px}
.tlscroll::-webkit-scrollbar{width:8px}.tlscroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:9px}
.tl{position:relative}.tl.drop{background:rgba(139,124,246,.09)}
.hl{position:absolute;left:0;right:0;border-top:1px solid rgba(255,255,255,.07)}.hl span{position:absolute;left:10px;top:3px;font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.hl.half{border-top:1px dashed rgba(255,255,255,.035)}
.tlb{position:absolute;left:58px;right:10px;top:0;bottom:0}
.blk{position:absolute;border-radius:10px;padding:4px 8px 10px;background:color-mix(in srgb,var(--c) 24%,#141327);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);border-left:4px solid var(--c);overflow:hidden;cursor:grab;touch-action:none;user-select:none;font-size:12.5px;line-height:1.25;transition:box-shadow .12s}
.blk:hover{box-shadow:0 6px 22px rgba(0,0,0,.45);z-index:3}.blk.dragging{cursor:grabbing;z-index:6;box-shadow:0 12px 34px rgba(0,0,0,.65);transition:none}
.blk.tent{border-style:dashed;background:transparent}.blk.done{opacity:.45}.blk.done .bt{text-decoration:line-through}
.blk .rz{position:absolute;left:0;right:0;bottom:0;height:10px;cursor:ns-resize;background:linear-gradient(transparent,rgba(255,255,255,.16))}
.blk .cb{width:16px;height:16px;border-radius:5px;font-size:10px;float:left;margin:1px 6px 0 0;border-width:2px}
.blk b{font-weight:600;opacity:.9;margin-right:4px;font-variant-numeric:tabular-nums}
#nowl{position:absolute;left:-8px;right:0;height:2px;background:#f87171;box-shadow:0 0 8px #f87171;z-index:5;pointer-events:none}#nowl::before{content:'';position:absolute;left:0;top:-3px;width:8px;height:8px;border-radius:50%;background:#f87171}
.arena{grid-column:2;position:relative;border-top:1px solid var(--line);background:linear-gradient(#0d0c1f,#17143a);}
#hud{display:flex;align-items:center;gap:12px;padding:5px 16px;font-size:12px;background:rgba(0,0,0,.25)}
#hud b{font-variant-numeric:tabular-nums}.xpb{width:90px;height:6px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}.xpb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#fbbf24,#fb923c)}
#hbuff span{background:rgba(251,191,36,.16);color:#fcd34d;border:1px solid rgba(251,191,36,.4);padding:1px 8px;border-radius:99px;margin-right:6px}
#arena canvas{display:block;width:100%;image-rendering:pixelated}
#shop{position:absolute;right:14px;bottom:100%;width:300px;background:#14132a;border:1px solid var(--line);border-radius:14px 14px 0 0;padding:12px 14px;box-shadow:0 -10px 40px rgba(0,0,0,.5);display:none;z-index:20}
#shop.on{display:block}
#dex{position:absolute;right:14px;bottom:100%;width:400px;max-height:70vh;overflow:auto;background:#14132a;border:1px solid var(--line);border-radius:14px 14px 0 0;padding:12px 14px;box-shadow:0 -10px 40px rgba(0,0,0,.5);display:none;z-index:21}#dex.on{display:block}
#dex h4,#shop h4{margin:0 0 4px;display:flex;justify-content:space-between;font-size:13px}#dex h4 span{color:var(--mut);font-weight:400}
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-height:300px;overflow:auto;margin:8px 0;padding:2px}
.dc{background:var(--card2);border:2px solid transparent;border-radius:10px;padding:4px 2px;text-align:center;cursor:pointer;font-size:10px;line-height:1.25}.dc:hover{border-color:rgba(255,255,255,.25)}.dc.sel{border-color:#fbbf24}
.dc img{width:56px;height:56px;image-rendering:pixelated;display:block;margin:0 auto}.dc small{display:block;color:var(--mut)}
.dc.t1{box-shadow:inset 0 0 0 1px rgba(96,165,250,.55)}.dc.t2{box-shadow:inset 0 0 0 1px rgba(251,191,36,.8)}
.notes{display:grid;grid-template-columns:230px 1fr;gap:16px;min-height:440px;margin-top:14px}.nlist{display:flex;flex-direction:column;gap:8px;max-height:68vh;overflow:auto}
.nitem{padding:9px 11px;border-radius:10px;background:var(--card2);cursor:pointer;border:1px solid transparent}.nitem:hover{border-color:var(--line)}.nitem.on{border-color:var(--acc);background:rgba(139,124,246,.14)}.nitem small{display:block;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ned{display:flex;flex-direction:column;gap:10px}.ned input{font-size:17px;font-weight:600}.ned textarea{flex:1;min-height:360px;resize:vertical;line-height:1.55;font-size:14px}
.slotrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}.slotrow:last-child{border:0}.slotrow .when{color:var(--mut);font-size:12px;white-space:nowrap}
.dc.fx img,.dc.fsx img{filter:brightness(.5) sepia(1) hue-rotate(235deg) saturate(4) drop-shadow(0 0 4px #a855f7)}.up{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}.up:last-child{border:0}.up div{flex:1}.up small{color:var(--mut);display:block}
.days{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.dchk{display:flex;align-items:center;gap:4px;font-size:12px;text-transform:none;letter-spacing:0;color:var(--txt);background:var(--card2);padding:4px 9px;border-radius:8px;cursor:pointer}.dchk input{width:auto}
.f label{font-size:11px;color:var(--mut);display:flex;flex-direction:column;gap:4px;text-transform:uppercase;letter-spacing:.8px}
.chk{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:13px}.chk input{width:auto}
.mbtn{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.pickrow{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;cursor:pointer}.pickrow:hover{background:var(--card2)}
#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:60;width:340px}
.toast{background:#1b1a38;border:1px solid rgba(139,124,246,.5);border-radius:14px;padding:14px 16px;box-shadow:0 14px 50px rgba(0,0,0,.55);animation:up .25s ease}
.toast .h{font-weight:700;margin-bottom:2px}.toast .b{display:flex;gap:6px;margin-top:10px}
.toast.quiet{padding:9px 14px;border-color:var(--line);font-size:13px}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.flame{font-size:30px}
@media(max-width:1180px){.tgrid,.cal{grid-template-columns:1fr}}
</style></head>
<body>
<nav id="side">
  <div class="logo"><i>⚡</i>Lock In</div>
  <button class="nav" data-act="nav" data-v="today">☀️ Today</button>
  <button class="nav" data-act="nav" data-v="calendar">🗓 Calendar</button>
  <button class="nav" data-act="nav" data-v="inbox">📥 Inbox <b id="b-inbox"></b></button>
  <button class="nav" data-act="nav" data-v="content">🎬 Content</button>
  <button class="nav" data-act="nav" data-v="jobs">💼 Jobs</button>
  <button class="nav" data-act="nav" data-v="notes">📝 Notes</button>
  <button class="nav" data-act="nav" data-v="focus">🎯 Focus</button>
  <div class="sp"></div>
  <div id="mini" data-act="nav" data-v="focus" style="cursor:pointer"><div class="mut" style="font-size:11px">LOCKED IN</div><div class="t" id="minit">25:00</div></div>
  <button class="nav" data-act="settings">⚙️ Settings</button>
  <div id="clock"></div>
</nav>
<header id="top">
  <div id="cap"><span>＋</span><input id="capin" autocomplete="off" placeholder='Drop anything…  e.g. "every tue gym 4.15-5.15pm"  ·  no date = Inbox  ·  end with ? to pencil it in'><kbd>N</kbd></div>
  <div id="saved"></div>
</header>
<main id="main"></main>
<div id="arena" class="arena"><div id="shop"></div><div id="dex"></div><div id="hud"><b id="hlv">Lv 1</b><div class="xpb"><i id="hxp"></i></div><span>🪙 <b id="hg">0</b></span><span>Wave <b id="hw">1</b></span><span id="hbuff"></span><span style="flex:1"></span><span class="mut" id="hhint"></span><button class="btn sm pri" data-act="catch" id="hcatch" style="display:none"></button><button class="btn sm" data-act="dex" id="hdex">📖 Dex</button><button class="btn sm" data-act="shop">🛒 Upgrades</button><button class="btn sm" data-act="arenatoggle" id="hfold">▾</button></div><canvas id="arenac" height="124"></canvas></div>
<div id="modal"></div><div id="toasts"></div>

<script>
const AREAS={content:{n:'Content',c:'var(--content)'},jobs:{n:'Jobs',c:'var(--jobs)'},life:{n:'Life',c:'var(--life)'}};
const STAGES={jobs:[['saved','To apply'],['applied','Applied'],['interview','Interview'],['offer','Offer'],['rejected','Closed']],
content:[['idea','Idea'],['script','Scripted'],['filmed','Filmed'],['edited','Edited'],['posted','Posted']]};
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON3=MONTHS.map(m=>m.slice(0,3)),DOW3=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

/* another window / Claude changed your plan -> pick it up instead of overwriting it (3-way merge per item) */

  if(!snap.has(si.id)){out.push(li||si);continue}      // new on the server (or added locally with the same id)
  if(!li)continue;                                      // you deleted it here
  out.push(JSON.stringify(li)!==snap.get(si.id)?li:si)} // you edited it here -> yours; otherwise take the server's
 for(const li of local)if(!seen.has(li.id)&&!snap.has(li.id))out.push(li);   // you added it here, not saved yet
 return out}

const WD={mon:1,tue:2,wed:3,thu:4,fri:5,sat:6,sun:0};
const DAYRE='(?:mon(?:day)?|tue(?:s(?:day)?)?|wed(?:nesday)?|thu(?:rs(?:day)?)?|fri(?:day)?|sat(?:urday)?|sun(?:day)?)';
const dnum=w=>WD[w.slice(0,3).toLowerCase()];
const WDN=[1,2,3,4,5,6,0];

function parseRepeat(s){

  const hasEvery=/\b(?:every|each|weekly)\b/i.test(s);

  else if(m=s.match(/\b(?:mon|tues?|wed(?:nes)?|thu(?:rs?)?|fri|sat(?:ur)?|sun)days\b/i))days=[dnum(m[0])];

  else if(m=s.match(/\b(?:every\s*day|each\s*day|daily)\b/i))days=[0,1,2,3,4,5,6];
  else if(m=s.match(/\b(?:every\s+week|each\s+week|weekly)\b/i))days=[];

  s=s.replace(m[0],' ');

function parseQuick(raw){

  s=s.replace(/\sr(\d{1,3})\b/i,(m,n)=>{it.remind=+n;return' '});
  const R=parseRepeat(s);s=R.s;
  let generic=null;
  if(R.rep){it.tentative=false;if(R.rep.days.length){it.repeat={days:R.rep.days,interval:R.rep.interval};d=pISO(firstOcc(it.repeat.days))}else generic=R.rep.interval}

  s=s.replace(/\b(today|tonight)\b/i,()=>{d=now;return' '});
  s=s.replace(/\b(tomorrow|tmrw|tmr)\b/i,()=>{d=addDays(now,1);return' '});

  }

    if(h1>23||h2>23||(m1&&+m1>59)||(m2&&+m2>59)||(!a1&&!a2&&!m1&&!m2))return m;
    let t1,t2;

    else if(!a1&&!a2){if(h1<=7&&h2<=12){t1=to24(h1,'pm');t2=to24(h2,'pm')}else{t1=h1;t2=h2}}

  if(!it.time)s=s.replace(/\b(?:at\s+)?(\d{1,2})(?:[:.](\d{2}))?\s?(am|pm)\b/i,(m,h,mi,ap)=>{h=(+h)%12;if(/pm/i.test(ap))h+=12;it.time=pad(h)+':'+(mi||'00');return' '});

  if(d)it.date=iso(d);
  if(it.time&&it.remind==null)it.remind=S.settings.remindDefault;

}

VIEWS.calendar=()=>{
  const y=cursor.getFullYear(),m=cursor.getMonth();let start,n,title;
  if(calMode==='month'){const f=new Date(y,m,1);start=addDays(f,-((f.getDay()+6)%7));n=42;title=MONTHS[m]+' '+y}
  else{start=addDays(cursor,-((cursor.getDay()+6)%7));n=7;title=fmtDay(iso(start))+' – '+fmtDay(iso(addDays(start,6)))}
  const td=iso(new Date());let cells='';
  for(let k=0;k<n;k++){const d=addDays(start,k),ds=iso(d),l=itemsOn(ds).sort(byTime),max=calMode==='month'?3:99;
    cells+=`<div class="cell ${ds===td?'today':''} ${ds===selDay?'sel':''} ${calMode==='month'&&d.getMonth()!==m?'other':''}" data-drop="day" data-day="${ds}" data-act="selday">
    <div class="d"><span>${d.getDate()}</span></div>${l.slice(0,max).map(chip).join('')}${l.length>max?`<div class="more">+${l.length-max} more</div>`:''}</div>`}
  const sel=itemsOn(selDay).sort(byTime),inb=inboxItems();
  return `<div class="cal"><div class="calmain"><div class="calhead"><h2>${title}</h2>
  <div class="seg"><button class="${calMode==='month'?'on':''}" data-act="mode" data-m="month">Month</button><button class="${calMode==='week'?'on':''}" data-act="mode" data-m="week">Week</button></div>

  <aside class="side"><div class="card"><h4>${relDay(selDay)} <span>${sel.length}</span></h4>${sel.map(i=>row(i)).join('')||'<div class="empty-note">Free day. Add something ↓</div>'}

/* ---------- focus timer ---------- */
function initF(){const m=S.settings.focusMin*60;F={mode:'focus',total:m,left:m,running:false,end:0,task:''}}
const fFmt=s=>pad(Math.floor(s/60))+':'+pad(s%60);
function fStart(){F.running=true;F.end=Date.now()+F.left*1000;paint()}
function fPause(){F.left=Math.max(0,Math.round((F.end-Date.now())/1000));F.running=false;paint()}
function fReset(){F.running=false;F.total=F.left=(F.mode==='focus'?S.settings.focusMin:S.settings.breakMin)*60;paint()}
function fDone(){F.running=false;beep();const td=iso(new Date());
  if(F.mode==='focus'){(S.days[td]=S.days[td]||{}).focus=((S.days[td]||{}).focus||0)+1;reward('focus');save();F.mode='break';F.total=F.left=S.settings.breakMin*60;banner('🎯 Session done','Stand up, water, breathe. Break time.',[['Start break','fstart'],['Skip','dismiss']])}
  else{F.mode='focus';F.total=F.left=S.settings.focusMin*60;banner('Break over','Ready for another round?',[['Start focus','fstart'],['Later','dismiss']])}
  if(view==='focus'||view==='today')render()}
function paint(){const t=$('#ftime');if(t){t.textContent=fFmt(F.left);const r=$('#fring');if(r)r.style.strokeDashoffset=String(754*(1-F.left/F.total));const b=$('#fgo');if(b)b.textContent=F.running?'Pause':'Start'}
  $('#mini').classList.toggle('on',F.running);$('#minit').textContent=fFmt(F.left)}
VIEWS.focus=()=>{
  ensureTop3();const td=iso(new Date());
  const pool=[...S.top3.ids.map(byId),...S.items.filter(i=>i.date===td&&!i.done)].filter((x,k,a)=>x&&a.indexOf(x)===k);
  const sess=(S.days[td]||{}).focus||0;
  return `<div class="focus"><div class="mut" style="letter-spacing:2px;text-transform:uppercase;font-size:12px">${F.mode==='focus'?'Deep work':'Break'}</div>
  <div class="ring"><svg width="300" height="300"><circle cx="150" cy="150" r="120" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="10"/><circle id="fring" cx="150" cy="150" r="120" fill="none" stroke="url(#g)" stroke-width="10" stroke-linecap="round" stroke-dasharray="754" style="stroke-dashoffset:${754*(1-F.left/F.total)};transition:stroke-dashoffset .5s linear"/><defs><linearGradient id="g"><stop offset="0" stop-color="#8b7cf6"/><stop offset="1" stop-color="#5b8cff"/></linearGradient></defs></svg>
  <div class="c"><div class="tt" id="ftime">${fFmt(F.left)}</div><div class="mut">${sess} session${sess===1?'':'s'} today</div></div></div>
  <div style="width:360px"><select data-chg="ftask"><option value="">What are you locking in on?</option>${pool.map(i=>`<option value="${i.id}" ${F.task===i.id?'selected':''}>${esc(i.title)}</option>`).join('')}</select></div>
  <div class="ctl"><button class="btn pri" id="fgo" data-act="ftoggle" style="min-width:110px;padding:10px 20px;font-size:15px">${F.running?'Pause':'Start'}</button><button class="btn" data-act="freset">Reset</button><button class="btn" data-act="fskip">${F.mode==='focus'?'Skip to break':'Skip break'}</button><button class="btn" data-act="zen">Zen mode</button></div>
  <div class="card park"><h4>🅿️ Parking lot</h4><div class="mut" style="font-size:12px;margin-bottom:8px">Random thought mid-focus? Park it here — it goes to your Inbox. Back to work.</div><input type="text" id="parkIn" placeholder="Park a thought… (Enter)"></div></div>`};

/* ---------- render ---------- */
function render(){
  if(view==='notes'&&/^n_(title|body)$/.test((document.activeElement||{}).id||''))return;
  $$('.nav[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  $('#b-inbox').textContent=inboxItems().length||'';
  const _old=$('#tlscroll');if(_old)tlScroll=_old.scrollTop;
  $('#main').innerHTML=VIEWS[view]();paint();
  const _t=$('#tlscroll');if(_t){if(tlScroll===null){const n=new Date(),lo=+_t.firstChild.dataset.lo;_t.scrollTop=Math.max(0,(n.getHours()*60+n.getMinutes()-lo)/60*PPH-140)}else _t.scrollTop=tlScroll}
  if(view==='calendar')$('#main').style.overflow='hidden';else $('#main').style.overflow='auto';
}
/* ---------- editor ---------- */
function openEdit(it,isNew,occ){E=Object.assign({},it);if(it.checklist)E.checklist=it.checklist.map(c=>Object.assign({},c));E.repeat=it.repeat?{days:[...it.repeat.days],interval:it.repeat.interval||1}:null;E._new=!!isNew;E._occ=occ||null;drawEdit()}
function repUI(){const r=E.repeat,k=!r?'':r.days.length===7?'daily':(r.days.slice().sort().join()==='1,2,3,4,5'&&r.interval===1)?'weekdays':r.interval>1?'fortnightly':'weekly';

  ((k==='weekly'||k==='fortnightly')?`<div class="days">${[1,2,3,4,5,6,0].map(d=>`<label class="dchk"><input type="checkbox" class="e_day" value="${d}" ${r.days.includes(d)?'checked':''}>${DOW3[(d+6)%7]}</label>`).join('')}</div>`:'')}
function drawEdit(){

  const rems=[['',"None"],[0,'At the time'],[5,'5 min before'],[10,'10 min before'],[30,'30 min before'],[60,'1 hour before'],[1440,'1 day before']];

  <label>Date<input type="date" id="e_date" value="${E.date||''}"></label><label>Time<input type="time" id="e_time" value="${E.time||''}"></label><label>Ends<input type="time" id="e_end" value="${E.endTime||''}"></label></div>
  <div class="f"><label>Remind<select id="e_rem">${rems.map(([v,n])=>`<option value="${v}" ${(E.remind==null?'':E.remind)==v&&(E.remind==null)==(v==='')?'selected':''}>${n}</option>`).join('')}</select></label>${stSel}</div>
  ${repUI()}
  ${E.area==='jobs'?`<div class="f"><label>Company<input type="text" id="e_co" value="${esc(E.company)}"></label><label>Link<input type="text" id="e_link" value="${esc(E.link)}" placeholder="https://…"></label></div>`:''}
  <label class="chk"><input type="checkbox" id="e_tent" ${E.tentative?'checked':''}> Pencilled in — not confirmed yet</label>
  <div class="mbtn"><button class="btn pri" data-act="saveEdit">Save</button>${E.tentative&&E.date?'<button class="btn ok" data-act="confirmEdit">Confirm date ✓</button>':''}${!E._new&&E.date&&!E.repeat?'<button class="btn" data-act="toinboxEdit">Back to inbox</button>':''}${E._occ?'<button class="btn bad" data-act="skipOcc">Delete just this one</button><button class="btn bad" data-act="cutAfter">Delete this &amp; all after</button>':''}<button class="btn" data-act="closeModal">Cancel</button><span class="sp" style="flex:1"></span>${!E._new?`<button class="btn bad" data-act="delEdit">${E.repeat?'Delete all in series':'Delete'}</button>`:''}</div></div>`;

let actx;function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();[0,.18,.36].forEach((t,k)=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=[660,880,1100][k];o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.0001,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(.25,actx.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+t+.3);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.32)})}catch(e){}}

function fireInfo(i){if(!i.date||i.done||i.tentative||i.remind==null)return null;const[h,m]=(i.time||'09:00').split(':').map(Number);const due=pISO(i.date);due.setHours(h,m,0,0);let f=new Date(due.getTime()-i.remind*60000);if(i.snooze){const sn=new Date(i.snooze);if(sn>f)f=sn}return{due,fire:f,key:iso(f)+'T'+pad(f.getHours())+':'+pad(f.getMinutes())}}
function checkReminders(){const now=new Date();let any=false;for(const i of [...S.items.filter(x=>!x.repeat),...itemsOn(iso(now))]){const k=fireInfo(i);if(!k)continue;const fk=i._occ?i.id+'@'+i._occ:i.id;
  if(now>=k.fire&&now<new Date(k.due.getTime()+2*36e5)&&S.fired[fk]!==k.key){S.fired[fk]=k.key;any=true;beep();
    banner('⏰ '+(i.emoji?i.emoji+' ':'')+i.title,i.time?((now>=k.due?'Started ':'Starts ')+fmtTime(i.time)+(now<k.due?' · in '+Math.max(1,Math.round((k.due-now)/6e4))+' min':'')):'Today',[['Done','rdone'],['Snooze 10m','rsnooze'],['Dismiss','dismiss']],i.id,i._occ);
    try{if(Notification.permission==='granted')new Notification('Lock In: '+i.title,{body:i.time?'Starts '+fmtTime(i.time):'Today'})}catch(e){}}}
  if(any){save();if(view==='today')render()}}

  if(pm&&!lm&&G.rest<=0)drawMon(x,pm.id,pm.f,hx-50,gy+Math.round(bob),64,now,true);
  if(G.bolt&&now-G.bolt.t<160){x.strokeStyle='rgba(196,181,253,'+(1-(now-G.bolt.t)/160)+')';x.lineWidth=3;x.beginPath();x.moveTo(G.bolt.x1,gy-34);x.lineTo(G.bolt.x2,gy-30);x.stroke()}

  const st=gstats();x.fillStyle='rgba(255,255,255,.12)';x.fillRect(hx-24,gy+4,48,4);x.fillStyle='#4ade80';x.fillRect(hx-24,gy+4,48*Math.max(0,G.hp)/st.max,4);
  for(const e of G.enemies){const sp=spr(e.t);e.shake*=0.8;const fy=e.t==='bat'?-26+Math.sin(now/180+e.x)*6:0,ex=e.x+(Math.random()-.5)*e.shake;x.drawImage(sp,Math.round(ex-sp.width/2),Math.round(gy-sp.height+fy));
    x.fillStyle='rgba(255,255,255,.12)';x.fillRect(ex-18,gy-sp.height+fy-8,36,3);x.fillStyle='#f87171';x.fillRect(ex-18,gy-sp.height+fy-8,36*Math.max(0,e.hp)/e.max,3)}
  G.texts=G.texts.filter(t=>t.t<900);x.font='bold 12px sans-serif';x.textAlign='center';for(const t of G.texts){t.t+=16;x.globalAlpha=Math.max(0,1-t.t/900);x.fillStyle=t.col;x.fillText(t.txt,t.x,H-t.y-t.t/22-30)}x.globalAlpha=1;
  if(G.bannerT>0){x.globalAlpha=Math.min(1,G.bannerT/500);x.font='bold 16px sans-serif';x.fillStyle='#fff';x.fillText(G.banner,W/2,26);x.globalAlpha=1}x.textAlign='left'}
function hudTick(){const g=gs(),st=gstats();$('#hlv').textContent='Lv '+g.lvl;$('#hxp').style.width=Math.min(100,g.xp/(g.lvl*40+20)*100)+'%';$('#hg').textContent=g.gold;$('#hw').textContent=g.wave;
  const b=[];if(st.lock)b.push('<span>🔒 Locked in ×1.5</span>');if(st.surge)b.push('<span>⚡ Surge ×2 · '+Math.ceil((G.surge-Date.now())/1000)+'s</span>');$('#hbuff').innerHTML=b.join('');

function arenaFrame(ts){requestAnimationFrame(arenaFrame);if(!S||document.hidden){G.last=ts;return}

/* ---------- content: episode checklist, weekly reel counter, EP Studio link ---------- */
const EP_STEPS=['Pick the next follower from the queue','Photo cut-out saved (ChatGPT)','Record the spin (Record mode)','Edit in CapCut (memes + pacing)','Accept the card on the VDS site','Post it','Log views, shares and sign-ups after 24h'];

const clUI=()=>E.checklist?`<div class="card" style="margin-top:10px;padding:10px 12px"><h4 style="margin-bottom:4px">Checklist <span>${clDone(E)}/${E.checklist.length}</span></h4>${E.checklist.map((c,k)=>`<label class="chk" style="margin:4px 0"><input type="checkbox" data-chg="clt" data-k="${k}" ${c.d?'checked':''}> ${esc(c.t)}</label>`).join('')}</div>`:(E.area==='content'?'<button class="btn sm" data-act="addcl" style="margin-top:8px">☑ Add episode checklist</button>':'');
/* ---------- auto-slot the inbox ---------- */
const tmin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m},mtime=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const SLOT_DAY=[9*60,21*60],SLOT_BUF=15,SLOT_PERDAY=3;let AS=null;
function planSlots(items,days=10){const out=[],used={},cnt={},now=new Date();
 for(const it of items){const dur=it.area==='jobs'?45:60;let placed=null;
  for(let d=0;d<days&&!placed;d++){const ds=iso(addDays(now,d));if((cnt[ds]||0)>=SLOT_PERDAY)continue;
   const busy=itemsOn(ds).filter(x=>x.time&&!x.done).map(x=>{const a=tmin(x.time),b=x.endTime?tmin(x.endTime):a+60;return[a-SLOT_BUF,Math.max(b,a+15)+SLOT_BUF]}).concat(used[ds]||[]).sort((a,b)=>a[0]-b[0]);
   let cur=SLOT_DAY[0];if(d===0)cur=Math.max(cur,Math.ceil((now.getHours()*60+now.getMinutes()+15)/15)*15);
   for(const[bs,be] of busy){if(bs-cur>=dur)break;cur=Math.max(cur,be)}
   if(cur+dur<=SLOT_DAY[1]){placed={date:ds,time:mtime(cur),endTime:mtime(cur+dur)};(used[ds]=used[ds]||[]).push([cur-SLOT_BUF,cur+dur+SLOT_BUF]);cnt[ds]=(cnt[ds]||0)+1}}
  out.push({it,p:placed})}
 return out}
function openAutoSlot(){const inb=inboxItems().filter(i=>!i.repeat);if(!inb.length){say('Inbox is empty — nothing to slot');return}AS=planSlots(inb);drawAuto()}
function drawAuto(){const ok=AS.filter(x=>x.p),no=AS.filter(x=>!x.p);
 $('#modal').innerHTML=`<div class="mcard"><h3>✨ Auto-slot</h3><p class="mut" style="margin:0 0 10px;font-size:13px">I looked at your week and found gaps (9am–9pm, 15 min clear of anything else, max ${SLOT_PERDAY} a day). Nothing is final: these are <b>pencilled in</b> until you confirm each one.</p>
 ${ok.map(x=>`<div class="slotrow"><span class="dot" ${dotc(x.it)}></span><span style="flex:1">${ti(x.it)}</span><span class="when">${relDay(x.p.date)} · ${fmtRange(x.p)}</span><button class="btn sm bad" data-act="asskip" data-id="${x.it.id}">✕</button></div>`).join('')||'<div class="empty-note">No free gaps found in the next 10 days.</div>'}
 ${no.length?`<p class="mut" style="font-size:12px;margin-top:8px">${no.length} didn't fit in the next 10 days and will stay in the Inbox.</p>`:''}
 <div class="mbtn">${ok.length?`<button class="btn pri" data-act="asapply">Pencil in ${ok.length}</button>`:''}<button class="btn" data-act="closeModal">Cancel</button></div></div>`;$('#modal').classList.add('on')}
/* ---------- notes ---------- */
let NOTE=null;
VIEWS.notes=()=>{const ns=(S.notes||[]).slice().sort((a,b)=>b.updated-a.updated);if(!NOTE||!ns.some(n=>n.id===NOTE))NOTE=ns[0]?ns[0].id:null;const n=ns.find(x=>x.id===NOTE);
 return `<h2>Notes</h2><p class="mut" style="margin:4px 0">A scratchpad for thinking. Start a line with <b>[]</b> and it can become an Inbox task (dates like “fri 3pm” work too).</p>
 <div class="notes"><div class="nlist"><button class="btn pri" data-act="newnote">＋ New note</button>${ns.map(x=>`<div class="nitem ${x.id===NOTE?'on':''}" data-act="opennote" data-id="${x.id}"><b>${esc(x.title||'Untitled')}</b><small>${esc(((x.body||'').split('\n').find(l=>l.trim())||'Empty').slice(0,60))}</small></div>`).join('')||'<div class="empty-note">No notes yet.</div>'}</div>
 <div class="ned">${n?`<input type="text" id="n_title" value="${esc(n.title)}" placeholder="Title"><textarea id="n_body" placeholder="Write anything…">${esc(n.body)}</textarea><div class="mbtn" style="margin:0"><button class="btn" data-act="note2tasks">⚡ Turn [] lines into Inbox tasks</button><span style="flex:1"></span><button class="btn bad" data-act="delnote">Delete note</button></div>`:'<div class="empty-note">Create a note to start writing.</div>'}</div></div>`};
document.addEventListener('input',e=>{const el=e.target;if(el.id!=='n_title'&&el.id!=='n_body')return;const n=(S.notes||[]).find(x=>x.id===NOTE);if(!n)return;
 if(el.id==='n_title')n.title=el.value;else n.body=el.value;n.updated=Date.now();save();const li=$('.nitem.on');if(li){li.querySelector('b').textContent=n.title||'Untitled';li.querySelector('small').textContent=((n.body||'').split('\n').find(l=>l.trim())||'Empty').slice(0,60)}});
/* ---------- connector: commands from Claude (through the local MCP server) ---------- */
const DRE=/^\d{4}-\d\d-\d\d$/,TRE=/^([01]?\d|2[0-3]):[0-5]\d$/,APPL={};let _qBusy=false;
function cmdFields(f){const o={};if(!f)return o;
 ['title','notes','area','link','company','emoji','color'].forEach(k=>{if(f[k]!==undefined)o[k]=f[k]===null?null:String(f[k])});
 if(o.area&&!['content','jobs','life'].includes(o.area))delete o.area;
 if(f.date!==undefined)o.date=f.date&&DRE.test(f.date)?f.date:null;
 ['time','endTime'].forEach(k=>{if(f[k]!==undefined)o[k]=f[k]&&TRE.test(f[k])?(f[k].length===4?'0'+f[k]:f[k]):null});
 if(f.tentative!==undefined)o.tentative=!!f.tentative;
 if(f.remind!==undefined)o.remind=f.remind===null?null:Math.max(0,+f.remind||0);
 if(f.repeat!==undefined)o.repeat=f.repeat&&Array.isArray(f.repeat.days)?{days:f.repeat.days.map(Number).filter(d=>d>=0&&d<=6),interval:Math.max(1,+f.repeat.interval||1)}:null;
 if(f.until!==undefined)o.until=f.until&&DRE.test(f.until)?f.until:null;
 return o}
function applyCmd(c){try{
 if(c.op==='quick'){const it=addQuick(String(c.text||''),{});if(!it)return{ok:false,msg:'Could not make sense of that text'};return{ok:true,id:it.id,msg:'Added "'+it.title+'"'+(it.date?' on '+it.date:' to the inbox')}}
 if(c.op==='add'){const f=cmdFields(c.fields);if(!f.title||!f.title.trim())return{ok:false,msg:'A title is required'};
  if(f.time&&!f.date&&!f.repeat)delete f.time;if(f.date&&f.time&&f.remind===undefined)f.remind=S.settings.remindDefault;
  const it=mk(f);if(!it.emoji)it.emoji=autoEmoji(it.title)||null;S.items.push(it);return{ok:true,id:it.id,msg:'Added "'+it.title+'"'+(it.date?' on '+it.date:' to the inbox')+(it.tentative?' (pencilled in)':'')}}
 const i=byId(c.id);if(!i)return{ok:false,msg:'No item with id '+c.id};
 if(c.op==='update'){Object.assign(i,cmdFields(c.fields));if(!i.date&&!i.repeat)i.tentative=false;return{ok:true,id:i.id,msg:'Updated "'+i.title+'"'}}
 if(c.op==='complete'){const undo=c.done===false;
  if(i.repeat){const ds=c.date&&DRE.test(c.date)?c.date:iso(new Date()),a=i.doneDates=i.doneDates||[],k=a.indexOf(ds);if(undo){if(k>=0)a.splice(k,1)}else if(k<0){a.push(ds);reward('task',i.id+'@'+ds)}}
  else if(undo)i.done=false;else if(!i.done){i.done=true;reward('task',i.id)}
  updateWin();return{ok:true,id:i.id,msg:(undo?'Marked not done: ':'Done: ')+i.title}}
 if(c.op==='delete'){const sc=c.scope||'all',dok=DRE.test(c.date||'');
  if(i.repeat&&sc==='occurrence'&&dok){(i.skip=i.skip||[]).push(c.date);return{ok:true,msg:'Removed '+i.title+' on '+c.date+' only'}}
  if(i.repeat&&sc==='future'&&dok){const d=new Date(c.date+'T12:00:00');d.setDate(d.getDate()-1);const u=iso(d);if(u>=i.date){i.until=u;return{ok:true,msg:'Ended '+i.title+' from '+c.date+' onwards'}}}
  S.items=S.items.filter(x=>x!==i);S.top3.ids=(S.top3.ids||[]).filter(x=>x!==i.id);return{ok:true,msg:'Deleted "'+i.title+'"'+(i.repeat?' (all occurrences)':'')}}
 return{ok:false,msg:'Unknown command'}}catch(e){return{ok:false,msg:'Error: '+e.message}}}
function softRender(n){const typing=/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||'');if($('#modal').classList.contains('on')||typing){if(n<20)setTimeout(()=>softRender(n+1),2000);return}render()}
function pollQueue(){if(_qBusy||!S)return;_qBusy=true;fetch('/api/queue',{headers:{'X-LockIn':'1'}}).then(r=>r.json()).then(j=>{const cmds=j.cmds||[];if(!cmds.length){_qBusy=false;return}

  setTimeout(()=>fetch('/api/queue/ack',{method:'POST',headers:{'Content-Type':'application/json','X-LockIn':'1'},body:JSON.stringify({results})}).then(()=>{_qBusy=false;if(changed){softRender(0);say('Claude updated your plan')}}).catch(()=>{_qBusy=false}),500)}).catch(()=>{_qBusy=false})}
